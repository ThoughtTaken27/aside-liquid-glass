<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Aside phone QA</title><style>html,body{margin:0;background:#242424;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}iframe{width:393px;height:852px;border:0;flex:none}</style></head><body><iframe id="phone" title="Phone preview"></iframe><script>const q=new URLSearchParams(location.search);const f=document.querySelector('iframe');f.style.width=Math.max(320,Math.min(600,Number(q.get('width'))||393))+'px';f.style.height=Math.max(500,Math.min(900,Number(q.get('height'))||852))+'px';const src=q.get('src')||'/gallery.html?home';f.src=src.startsWith('/')&&!src.startsWith('//')?src:'/gallery.html?home';</script></body></html>
